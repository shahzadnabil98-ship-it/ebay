name: RestKiste CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  # 1. JOB: Die Docker-Images lokal auf Fehler testen
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Frontend Docker Image testen
      run: |
        docker build -t restkiste-frontend:test ./frontend

    - name: Backend Docker Image testen
      run: |
        docker build -t restkiste-backend:test ./backend

  # 2. JOB: Das Backend bauen, zu AWS ECR schieben und den Server updaten
  deploy-to-aws:
    needs: build-and-test # Wartet, bis die Tests oben erfolgreich bestanden sind
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: AWS Zugangsdaten konfigurieren
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Bei AWS ECR einloggen
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Backend Image bauen und zu ECR pushen
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: restkiste-backend
        IMAGE_TAG: latest
      run: |
        # Baut das Image für die AWS-Server-Architektur (amd64) und pusht es
        docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    # GitHub verbindet sich per SSH mit Ihrem Amazon Linux Server und startet den Container neu
    - name: SSH Deployment auf EC2 Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 63.184.115.103
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Auf dem AWS-Server bei ECR anmelden
          aws ecr get-login-password --region eu-central-1 | sudo docker login --username AWS --password-stdin ://amazonaws.com
          # Alten Container stoppen und löschen (falls er schon läuft)
          sudo docker stop restkiste-backend || true
          sudo docker rm restkiste-backend || true
          # Das ganz frisch hochgeladene Image aus der Cloud ziehen
          sudo docker pull ://amazonaws.com/restkiste-backend:latest
          # Den neuen Container im Hintergrund starten
          sudo docker run -d -p 3000:3000 --name restkiste-backend ://amazonaws.com/restkiste-backend:latest
