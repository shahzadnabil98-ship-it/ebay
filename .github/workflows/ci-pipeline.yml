name: RestKiste CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Frontend Docker Image testen
      run: |
        docker build -t restkiste-frontend:test ./frontend

    - name: Backend Docker Image testen
      run: |
        docker build -t restkiste-backend:test ./backend

  deploy-to-aws:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: AWS Zugangsdaten konfigurieren
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Bei AWS ECR einloggen
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Backend & Frontend Images bauen und pushen
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Backend
        docker build --platform linux/amd64 -t $ECR_REGISTRY/restkiste-backend:$IMAGE_TAG ./backend
        docker push $ECR_REGISTRY/restkiste-backend:$IMAGE_TAG
        
        # Frontend
        docker build --platform linux/amd64 -t $ECR_REGISTRY/restkiste-frontend:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/restkiste-frontend:$IMAGE_TAG

    # Kopiert die docker-compose.yml Datei auf den AWS-Server
    - name: Docker Compose Datei auf EC2 übertragen (SCP)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 18.193.88.149
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "/home/ec2-user/"

    # Aktiviert das Trio via Docker Compose
    - name: SSH Deployment auf EC2 Server via Docker Compose
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 18.193.88.149
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        timeout: 10m
        script: |
          # 1. FIX: Docker Compose automatisch auf dem Server installieren, falls es fehlt
          if ! docker compose version &>/dev/null; then
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -SL "https://github.com(uname -m)" -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
          fi

          # 2. Bei ECR anmelden
          aws ecr get-login-password --region eu-central-1 | sudo docker login --username AWS --password-stdin 334321697724.dkr.ecr.eu-central-1.amazonaws.com
          
          # 3. In das Verzeichnis mit der kopierten docker-compose.yml wechseln
          cd /home/ec2-user/
          
          # 4. Alle 3 Container gleichzeitig updaten und im Hintergrund starten
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
