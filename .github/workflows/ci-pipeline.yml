name: RestKiste CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_ACCOUNT_ID: "334321697724"
  AWS_REGION: "eu-central-1"

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Frontend Docker Image testen
      run: |
        docker build -t restkiste-frontend:test ./frontend

    - name: Backend Docker Image testen
      run: |
        docker build -t restkiste-backend:test ./backend

  deploy-to-aws:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: AWS Zugangsdaten konfigurieren
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Bei AWS ECR einloggen
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Backend & Frontend Images bauen und pushen
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build --platform linux/amd64 -t $ECR_REGISTRY/restkiste-backend:$IMAGE_TAG ./backend
        docker push $ECR_REGISTRY/restkiste-backend:$IMAGE_TAG
        
        docker build --platform linux/amd64 -t $ECR_REGISTRY/restkiste-frontend:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/restkiste-frontend:$IMAGE_TAG

    - name: SSH Deployment auf EC2 Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 18.193.88.149
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        timeout: 10m
        script: |
          # 1. Das zerschossene AWS-CLI auf dem Server reparieren
          sudo pip3 uninstall -y urllib3 botocore awscli || true
          sudo yum reinstall -y aws-cli || true
          
          # 2. Die Registry-Adresse dynamisch zusammenbauen
          REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          
          # 3. Bei ECR anmelden
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin $REGISTRY
          
          # 4. Netzwerk sichern
          sudo docker network create restkiste-network || true
          
          # 5. Alte blockierende Container entfernen
          sudo docker rm -f restkiste-backend restkiste-frontend restkiste-database || true
          
          # 6. REPRÄSENTATIVE DATENBANK STARTEN
          sudo docker run -d -p 27017:27017 --name restkiste-database --network restkiste-network mongo:latest
          
          # 7. BACKEND STARTEN
          sudo docker pull $REGISTRY/restkiste-backend:latest
          sudo docker run -d -p 3000:3000 --name restkiste-backend --network restkiste-network --network-alias backend $REGISTRY/restkiste-backend:latest
          
          # 8. FRONTEND STARTEN
          sudo docker pull $REGISTRY/restkiste-frontend:latest
          sudo docker run -d -p 80:80 --name restkiste-frontend --network restkiste-network $REGISTRY/restkiste-frontend:latest
