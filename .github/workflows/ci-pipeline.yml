name: RestKiste CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Frontend Docker Image testen
      run: |
        docker build -t restkiste-frontend:test ./frontend

    - name: Backend Docker Image testen
      run: |
        docker build -t restkiste-backend:test ./backend

  deploy-to-aws:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: AWS Zugangsdaten konfigurieren
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Bei AWS ECR einloggen
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Backend & Frontend Images bauen und pushen
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Backend
        docker build --platform linux/amd64 -t $ECR_REGISTRY/restkiste-backend:$IMAGE_TAG ./backend
        docker push $ECR_REGISTRY/restkiste-backend:$IMAGE_TAG
        
        # Frontend (NEU)
        docker build --platform linux/amd64 -t $ECR_REGISTRY/restkiste-frontend:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/restkiste-frontend:$IMAGE_TAG

    - name: SSH Deployment auf EC2 Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 18.193.88.149
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        timeout: 10m
        script: |
          # Bei ECR anmelden
          aws ecr get-login-password --region eu-central-1 | sudo docker login --username AWS --password-stdin ://amazonaws.com
          
          # --- BACKEND NEUSTART ---
          sudo docker stop restkiste-backend || true
          sudo docker rm restkiste-backend || true
          sudo docker pull ://amazonaws.com/restkiste-backend:latest
          sudo docker run -d -p 3000:3000 --name restkiste-backend ://amazonaws.com/restkiste-backend:latest
          
          # --- FRONTEND NEUSTART (NEU auf Port 80) ---
          sudo docker stop restkiste-frontend || true
          sudo docker rm restkiste-frontend || true
          sudo docker pull ://amazonaws.com/restkiste-frontend:latest
          sudo docker run -d -p 80:80 --name restkiste-frontend ://amazonaws.com/restkiste-frontend:latest
