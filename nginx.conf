server {
    listen 80;
    server_name localhost;

    # 1. Alle normalen Anfragen gehen an dein FRONTEND
    location / {
        proxy_pass http://frontend; # Falls dein Frontend ein eigener Container ist, reicht das oft ohne Port oder mit dessen Port (z.B. :80)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Alle API-Anfragen gehen an dein BACKEND auf Port 3000
    location /api/ {
        proxy_pass http://backend:3000; # Hier greift jetzt deine server.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
